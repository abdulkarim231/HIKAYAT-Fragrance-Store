kind = "web"
previewPath = "/"
title = "HIKAYAT — Every Scent Tells a Story"
description = "A bilingual fragrance storefront powered by Next.js and Supabase."
version = "1.0.0"
id = "artifacts/hikayat"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/auth", "/api/catalog" ]
localPort = 24371

[services.development]
run = "pnpm --filter @workspace/hikayat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hikayat", "run", "build" ]
run = "pnpm --filter @workspace/hikayat run serve"

[services.env]
PORT = "24371"
BASE_PATH = "/"
